name: Limpieza Automática de Ventas

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalar dependencias
        run: pip install pandas gspread oauth2client requests
      
      - name: Ejecutar limpieza
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python limpiar.py    